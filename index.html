<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <!-- Canonical tag is dynamically set by setHead() in each route component -->
    <link rel="alternate" type="application/rss+xml" title="Jiri Hermann RSS" href="/rss.xml" />
    <title>Jiří Hermann - Backend Software Engineer</title>
    <meta name="description" content="Backend Software Engineer specializing in Kotlin, Java, Spring Boot, and scalable systems. Founder of Kotlin Server Squad community." />
    <!-- Static defaults for link-preview crawlers (LinkedIn, Slack, X), which do not run JS.
         setHead() overrides these per page for clients that do. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jiří Hermann" />
    <meta property="og:title" content="Jiří Hermann - Backend Software Engineer" />
    <meta property="og:description" content="Backend Software Engineer specializing in Kotlin, Java, Spring Boot, and scalable systems. Founder of Kotlin Server Squad community." />
    <meta property="og:image" content="https://jirihermann.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jiří Hermann — backend engineer building Kotlin systems and AI agent security tooling" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jirihermann.com/og-default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
